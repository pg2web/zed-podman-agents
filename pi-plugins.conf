# pi plugins baked into the zed-agents image and loaded in every project.
# None by default. Don't edit this file: put your own list in
#   ~/.config/zpa/pi-plugins.conf        (same format)
# then run: ./install.sh && zpa upgrade
#
# They are installed at build time into /opt/zpa/pi-plugins; the image's `pi`
# wrapper loads them with `-e`. A project can still `pi install` more plugins
# (stored in its .podman/home); if it installs one listed here, its own copy
# is used instead of the baked one.
#
# One spec per line, as for `pi install` (pin versions for reproducible builds):
#   npm:<package>[@version] | <package>   npm (bare names get npm:)
#   git:github.com/<owner>/<repo>[@ref]   git
#   github:<owner>/<repo>[@ref]           alias for git:github.com/...
#   https://github.com/<owner>/<repo>     git URL
#
# Example (nano-gpt provider; zpa also patches it and seeds its model catalog,
# see README "nano-gpt"):
#   pi-nano-gpt-provider
