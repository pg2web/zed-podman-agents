# ACP agents in the zed-agents image, one per line. Each becomes a Zed agent
# ("<Zed name>") that runs `zpa acp <kind>`. Don't edit this file: copy it to
#   ~/.config/zpa/agents.conf
# and edit that copy (it replaces this list), then run: ./install.sh && zpa upgrade
# See docs/adding-agents.md.
#
# kind | Zed name | ACP command (run in the container on stdio) | npm packages to install
#
# kind:     [a-z0-9-]+, used in `zpa acp <kind>`
# command:  split on spaces (no quoting); leading VAR=value words set env vars
# packages: installed with `npm install -g` at image build; pin versions.
#           `-` = nothing to install (pi and claude are installed by the
#           Containerfile, with version ARGs).
pi       | Pi (podman)       | PI_ACP_PI_COMMAND=pi node /opt/pi-acp/dist/index.js | -
claude   | Claude (podman)   | claude-agent-acp                                    | -
opencode | opencode (podman) | opencode acp                                        | opencode-ai@1.19.0
